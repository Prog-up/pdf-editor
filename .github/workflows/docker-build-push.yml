name: Build, Scan, and Push Docker Image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # Required for keyless signing via Sigstore Cosign

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Build Docker image
        run: docker build -t pdf-editor:local .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'pdf-editor:local'
          format: 'table'
          exit-code: '1' # Fails the build if vulnerabilities are found
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag, Push, and Sign Docker image
        if: github.event_name != 'pull_request'
        run: |
          IMAGE_NAME="${{ secrets.DOCKERHUB_USERNAME }}/pdf-editor"
          
          # Tag the image with 'latest' and the git commit SHA
          docker tag pdf-editor:local $IMAGE_NAME:latest
          docker tag pdf-editor:local $IMAGE_NAME:${{ github.sha }}
          
          # Push both tags to Docker Hub
          docker push $IMAGE_NAME:latest
          docker push $IMAGE_NAME:${{ github.sha }}
          
          # Extract and output the image hash (digest)
          IMAGE_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' $IMAGE_NAME:${{ github.sha }})
          echo "======================================"
          echo "Image successfully pushed!"
          echo "Image Hash (Digest): $IMAGE_DIGEST"
          echo "======================================"
          
          # Sign the image with Sigstore Cosign (Keyless integrity)
          echo "Generating integrity signature for Docker Hub..."
          cosign sign --yes $IMAGE_DIGEST
