name: Build, Scan, and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
      - '*.*.*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Build Docker image
        run: docker build -t pdf-editor:local .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'pdf-editor:local'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag, Push, and Sign Docker image
        if: github.event_name != 'pull_request'
        run: |
          IMAGE_NAME="${{ secrets.DOCKERHUB_USERNAME }}/pdf-editor"

          docker tag pdf-editor:local "$IMAGE_NAME:latest"
          docker tag pdf-editor:local "$IMAGE_NAME:${{ github.sha }}"

          docker push "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:${{ github.sha }}"

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            GIT_TAG="${GITHUB_REF#refs/tags/}"
            echo "Git tag pushed: $GIT_TAG"
            docker tag pdf-editor:local "$IMAGE_NAME:$GIT_TAG"
            docker push "$IMAGE_NAME:$GIT_TAG"

            if [[ "$GIT_TAG" == v* ]]; then
              STRIPPED_TAG="${GIT_TAG#v}"
              echo "Also pushing stripped tag: $STRIPPED_TAG"
              docker tag pdf-editor:local "$IMAGE_NAME:$STRIPPED_TAG"
              docker push "$IMAGE_NAME:$STRIPPED_TAG"
            else
              echo "Also pushing v-prefixed tag: v$GIT_TAG"
              docker tag pdf-editor:local "$IMAGE_NAME:v$GIT_TAG"
              docker push "$IMAGE_NAME:v$GIT_TAG"
            fi
          fi

          IMAGE_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE_NAME:latest")
          echo "======================================"
          echo "Image successfully pushed!"
          echo "Image Hash (Digest): $IMAGE_DIGEST"
          echo "======================================"

          echo "Generating integrity signature for Docker Hub..."
          cosign sign --yes "$IMAGE_DIGEST"
