<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Éditeur de texte PDF</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.css">
    <!-- pdf.js for rendering and text selection -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>
    <!-- pdf-lib for editing the PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <!-- FontKit for custom fonts if needed in pdf-lib -->
    <script src="https://unpkg.com/@pdf-lib/fontkit/dist/fontkit.umd.min.js"></script>
</head>
<body>
        <div class="toolbar">
        <div class="toolbar-section">
            <button id="browse-btn">Ouvrir un PDF</button>
            <input type="file" id="file-upload" accept="application/pdf" style="display: none;">
            
            <button id="add-font-btn">Ajouter une police (.ttf)</button>
            <input type="file" id="add-font-upload" accept=".ttf" style="display: none;">
            
            <button id="download-btn" disabled>Télécharger le PDF modifié</button>
        </div>
        
        <div class="toolbar-section toolbar-center" id="pagination-controls" style="visibility: hidden;">
            <button id="prev-page-btn">Précédent</button>
            <span id="page-info">Page 1</span>
            <button id="next-page-btn">Suivant</button>
        </div>

        <div class="toolbar-section toolbar-right" id="edit-controls">
            <input type="text" id="edit-input" autocomplete="off" placeholder="Sélectionnez le texte à modifier..." disabled>
            <button id="save-edit-btn" disabled>Modifier</button>
        </div>
    </div>

    <div id="pdf-container">
        <!-- Canvas for rendering the PDF -->
        <canvas id="pdf-canvas"></canvas>
        <!-- Text layer for highlighting -->
        <div id="text-layer" class="textLayer"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
